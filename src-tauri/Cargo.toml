[package]
name = "hoard"
version = "0.1.0"
description = "Hoard reference collection manager"
authors = ["Hoard"]
edition = "2021"

[lib]
name = "hoard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

